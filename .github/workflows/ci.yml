name: CI Contract Verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify Notes & Task Dashboard Contract (${{ matrix.os }})
    # 維護者在 Windows（cp950 終端）上跑這些工具；Windows runner 的 cp1252 一樣印不出中文與 emoji，
    # 能抓到「只有 Windows 才會 UnicodeEncodeError」的問題。不設 PYTHONUTF8，就是要測這個。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Run Contract Verification
        run: python tools/verify_inbox.py
