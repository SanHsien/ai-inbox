<!DOCTYPE html>
<html lang="zh-Hant" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shader Hero 自製範例：液態金屬與流體（WebGL，零構建）</title>
  <style>
    /*
      Anti-Slop 規範檢核：
      - SLOP-01: 零高擴散陰影，全採 1px 實色微邊框與深色表面分層。
      - SLOP-02: 零俗套藍紫霓虹漸層，採用 Slate / Titanium 鈦金灰冷色調。
      - SLOP-03: 零裝飾性 Emoji，採用幾何符號與結構化排版。
      - SLOP-04: 零虛假動態呼吸燈與假 LIVE，影格率與狀態文字皆來自實際執行結果。
      - SLOP-05: 零 AI 行銷黑話，全為具體技術規格與客觀指標。
    */
    :root {
      --bg-base: #020617;
      --bg-surface: rgba(15, 23, 42, 0.75);
      --bg-surface-hover: rgba(30, 41, 59, 0.85);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-active: rgba(255, 255, 255, 0.22);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent-cyan: #38bdf8;
      --accent-emerald: #10b981;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* 底層 WebGL Canvas */
    #gl-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      display: block;
    }

    /* 中層暗角與對比保護遮罩 */
    .viewport-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(circle at 50% 45%, rgba(2, 6, 23, 0.3) 0%, rgba(2, 6, 23, 0.85) 100%);
    }

    /* 頂層 Hero 內容佈局 */
    .hero-layout {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100vh;
      padding: 2.5rem 2rem;
      pointer-events: none;
    }

    .interactive {
      pointer-events: auto;
    }

    /* 頂部導覽列 */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }

    .brand-mark {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--text-main);
      text-transform: uppercase;
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-cyan);
      border-radius: 50%;
    }

    .hud-metrics {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 0.5rem 1rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      backdrop-filter: blur(8px);
    }

    .metric-item span {
      color: var(--text-main);
      font-weight: 600;
    }

    /* 中間主要文字區 */
    .hero-center {
      max-width: 840px;
      margin: auto;
      text-align: center;
      padding: 3rem 0;
    }

    .spec-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid var(--border-subtle);
      border-radius: 9999px;
      padding: 0.35rem 0.85rem;
      font-size: 0.75rem;
      font-family: var(--font-mono);
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    .hero-title {
      font-size: clamp(2.25rem, 5vw, 4rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: var(--text-main);
      margin-bottom: 1.25rem;
    }

    .hero-desc {
      font-size: 1.125rem;
      color: var(--text-muted);
      max-width: 640px;
      margin: 0 auto 2.5rem;
      line-height: 1.6;
    }

    /* 按鈕與操作群組 */
    .action-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.75rem;
      font-size: 0.875rem;
      font-weight: 500;
      border-radius: 6px;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn-primary {
      background-color: var(--text-main);
      color: #0f172a;
      border: 1px solid var(--text-main);
    }

    .btn-primary:hover {
      background-color: #e2e8f0;
    }

    .btn-secondary {
      background-color: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      backdrop-filter: blur(8px);
    }

    .btn-secondary:hover {
      background-color: var(--bg-surface-hover);
      border-color: var(--border-active);
    }

    /* 底部控制台與狀態欄 */
    .bottom-bar {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 1.5rem;
    }

    .controls-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 0.85rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      backdrop-filter: blur(8px);
    }

    .control-label {
      font-size: 0.75rem;
      color: var(--text-dim);
      font-family: var(--font-mono);
      text-transform: uppercase;
    }

    .segment-group {
      display: flex;
      background: rgba(2, 6, 23, 0.5);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      padding: 2px;
    }

    .segment-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.35rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 500;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .segment-btn.active {
      background: rgba(255, 255, 255, 0.12);
      color: var(--text-main);
    }

    .status-text {
      font-size: 0.75rem;
      color: var(--text-dim);
      font-family: var(--font-mono);
    }

    .origin-note {
      flex-basis: 100%;
      font-size: 0.75rem;
      color: var(--text-dim);
      max-width: 640px;
    }

    /* WebGL 不可用或著色器失敗時：隱藏畫布，改用 CSS 靜態漸層 */
    body.hero-fallback {
      background: linear-gradient(160deg, #020617 0%, #0f172a 55%, #1e293b 100%);
    }

    body.hero-fallback #gl-canvas {
      display: none;
    }

    #lifecycle-status[data-state="error"],
    #lifecycle-status[data-state="nowebgl"] {
      color: #fca5a5;
    }

    @media (prefers-reduced-motion: reduce) {
      .btn,
      .segment-btn {
        transition: none;
      }
    }

    @media (max-width: 768px) {
      .hero-layout {
        padding: 1.5rem 1rem;
      }
      .hud-metrics {
        display: none;
      }
      .bottom-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .controls-panel {
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>

  <!-- 原生 WebGL 畫布 -->
  <canvas id="gl-canvas"></canvas>

  <!-- 視覺對比遮罩 -->
  <div class="viewport-overlay" aria-hidden="true"></div>

  <!-- Hero 內容排版層 -->
  <div class="hero-layout">
    
    <!-- 頂部資訊列 -->
    <header class="top-nav">
      <div class="brand-mark interactive">
        <span class="brand-dot"></span>
        <span>Shader Hero 自製範例</span>
      </div>
      <div class="hud-metrics interactive">
        <div class="metric-item">FPS: <span id="fps-display">--</span></div>
        <div class="metric-item">畫布: <span id="res-display">--</span></div>
        <div class="metric-item">架構: <span>Zero-Dependency</span></div>
      </div>
    </header>

    <!-- 主標題區 -->
    <main class="hero-center">
      <div class="spec-pill interactive">
        <span>WebGL 1.0 全螢幕片段著色器 · 游標互動 · 支援 prefers-reduced-motion</span>
      </div>
      <h1 class="hero-title">高階商業視覺，零打包編譯。</h1>
      <p class="hero-desc">
        整份頁面只有一個 HTML 檔，沒有 npm 與外部腳本。背景是以程式生成的 GLSL 片段著色器：液態金屬模式的高光會跟著游標位置變化，流體模式則在游標周圍產生漣漪。
      </p>
      <div class="action-group interactive">
        <button type="button" class="btn btn-primary" id="btn-switch-mode">切換著色模式</button>
        <button type="button" class="btn btn-secondary" id="btn-toggle-sim">模擬 WebGL context 遺失並恢復</button>
      </div>
    </main>

    <!-- 底部控制項與狀態報告 -->
    <footer class="bottom-bar">
      <div class="controls-panel interactive">
        <span class="control-label">視覺維度</span>
        <div class="segment-group" role="group" aria-label="著色模式">
          <button type="button" class="segment-btn active" id="mode-metal" aria-pressed="true">液態金屬</button>
          <button type="button" class="segment-btn" id="mode-fluid" aria-pressed="false">流體波動</button>
        </div>
      </div>
      <div class="status-text interactive">
        <span id="lifecycle-status" aria-live="polite">生命週期狀態：初始化中</span>
      </div>
      <p class="origin-note">本檔是 ai-inbox 自行撰寫的示範，不是 Hacktemplates（dvklab）的原作，也沒有使用其程式碼或素材。</p>
    </footer>

  </div>

  <script>
    /*
      自製示範：本檔的 GLSL 與 JS 由 ai-inbox 自行撰寫，沒有複製 diiviikk5/Hacktemplates 的程式碼或素材。
      fBM（分形布朗運動）與 domain warping 是公開的通用技法，參考 The Book of Shaders 第 13 章（thebookofshaders.com/13/，2026-11-02 開啟查證）。
    */
    (function () {
      'use strict';

      // 1. 頂點與片段著色器原始碼 (GLSL ES 1.00)
      const VS_SOURCE = [
        'attribute vec2 a_position;',
        'varying vec2 v_uv;',
        'void main() {',
        '  v_uv = (a_position + 1.0) * 0.5;',
        '  gl_Position = vec4(a_position, 0.0, 1.0);',
        '}'
      ].join('\n');

      const FS_SOURCE = [
        '#ifdef GL_FRAGMENT_PRECISION_HIGH',
        'precision highp float;',
        '#else',
        'precision mediump float;',
        '#endif',
        'varying vec2 v_uv;',
        'uniform vec2 u_resolution;',
        'uniform float u_time;',
        'uniform vec2 u_mouse;',
        'uniform int u_mode;',

        'float hash(vec2 p) {',
        '  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);',
        '}',

        'float noise(vec2 p) {',
        '  vec2 i = floor(p);',
        '  vec2 f = fract(p);',
        '  vec2 u = f * f * (3.0 - 2.0 * f);',
        '  return mix(mix(hash(i + vec2(0.0, 0.0)), hash(i + vec2(1.0, 0.0)), u.x),',
        '             mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);',
        '}',

        'float fbm(vec2 p) {',
        '  float v = 0.0;',
        '  float a = 0.5;',
        '  mat2 rot = mat2(0.877, 0.479, -0.479, 0.877);',
        '  for (int i = 0; i < 4; i++) {',
        '    v += a * noise(p);',
        '    p = rot * p * 2.0 + vec2(0.1, 0.2);',
        '    a *= 0.5;',
        '  }',
        '  return v;',
        '}',

        // 滑鼠漣漪：以游標為圓心向外擴散並衰減的高度偏移。
        'float ripple(vec2 st, vec2 m) {',
        '  float d = length(st - m);',
        '  return sin(d * 14.0 - u_time * 4.5) * exp(-d * 2.5) * 0.30;',
        '}',

        // 液態金屬高度場 = 域扭曲 fBM + 滑鼠漣漪；法線由這個高度場差分而來，所以滑鼠會改變高光。
        'float metalHeight(vec2 st, vec2 r, vec2 m) {',
        '  return fbm(st * 1.6 + 3.0 * r) + ripple(st, m);',
        '}',

        'void main() {',
        '  vec2 st = (gl_FragCoord.xy * 2.0 - u_resolution) / min(u_resolution.x, u_resolution.y);',
        '  vec2 m = (u_mouse * 2.0 - u_resolution) / min(u_resolution.x, u_resolution.y);',

        '  if (u_mode == 0) {',
        '    vec2 q = vec2(fbm(st * 1.4 + vec2(0.0, u_time * 0.12)),',
        '                  fbm(st * 1.4 + vec2(5.2, 1.3 - u_time * 0.10)));',
        '    vec2 r = vec2(fbm(st * 1.8 + 4.0 * q + vec2(1.7, 9.2) + u_time * 0.08),',
        '                  fbm(st * 1.8 + 4.0 * q + vec2(8.3, 2.8) - u_time * 0.06));',

        '    vec2 eps = vec2(0.006, 0.0);',
        '    float h_x = (metalHeight(st + eps.xy, r, m) - metalHeight(st - eps.xy, r, m)) * 7.0;',
        '    float h_y = (metalHeight(st + eps.yx, r, m) - metalHeight(st - eps.yx, r, m)) * 7.0;',
        '    vec3 N = normalize(vec3(-h_x, -h_y, 1.0));',

        '    vec3 L = normalize(vec3(0.5, 0.7, 1.0));',
        '    vec3 V = vec3(0.0, 0.0, 1.0);',
        '    vec3 H = normalize(L + V);',

        '    float diff = max(dot(N, L), 0.0);',
        '    float spec = pow(max(dot(N, H), 0.0), 28.0);',
        '    float fresnel = pow(1.0 - max(dot(N, V), 0.0), 3.0);',

        '    vec3 baseCol = vec3(0.03, 0.05, 0.08);',
        '    vec3 midCol = vec3(0.16, 0.20, 0.26);',
        '    vec3 highCol = vec3(0.85, 0.90, 0.95);',

        '    vec3 col = mix(baseCol, midCol, diff);',
        '    col += highCol * (spec * 0.75 + fresnel * 0.35);',
        '    gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);',
        '  } else {',
        '    float t = u_time * 0.25;',
        '    vec2 p = st * 1.8;',
        '    float w1 = sin(p.x * 2.2 + t) * cos(p.y * 1.8 - t * 0.9);',
        '    float w2 = sin(p.x * 1.5 - t * 1.1) * cos(p.y * 2.2 + t);',
        '    float w3 = fbm(p + vec2(t * 0.15, -t * 0.12)) * 1.2;',
        '    float wave = (w1 + w2 + w3) * 0.35 + ripple(st, m) * 0.7;',

        '    vec3 deepWater = vec3(0.02, 0.05, 0.08);',
        '    vec3 oceanTeal = vec3(0.06, 0.22, 0.28);',
        '    vec3 waveFoam = vec3(0.35, 0.75, 0.85);',

        '    float foam = smoothstep(0.15, 0.55, wave);',
        '    vec3 col = mix(deepWater, oceanTeal, wave + 0.3);',
        '    col = mix(col, waveFoam, foam * 0.45);',
        '    float vign = 1.0 - smoothstep(0.8, 1.8, length(st));',
        '    col *= vign;',
        '    gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);',
        '  }',
        '}'
      ].join('\n');

      // 2. 狀態
      const STILL_TIME = 6.0;        // prefers-reduced-motion 時使用的固定時間點（秒）
      const MOUSE_TAU = 0.12;        // 游標平滑時間常數（秒），與影格率無關
      const ERROR_LOG_MAX = 200;     // 顯示在畫面上的錯誤訊息長度上限

      let canvas = null;
      let gl = null;
      let program = null;
      let positionBuffer = null;
      let vs = null;
      let fs = null;
      let rafId = null;

      let uResolutionLoc = null;
      let uTimeLoc = null;
      let uMouseLoc = null;
      let uModeLoc = null;

      let currentMode = 0;           // 0: 液態金屬, 1: 流體波動
      let targetMouseX = 0;
      let targetMouseY = 0;
      let currentMouseX = 0;
      let currentMouseY = 0;
      let startTime = performance.now();
      let lastFrameTime = null;
      let lastFpsTime = null;
      let frameCount = 0;
      let frozenTime = null;         // 測試／除錯用：非 null 時 u_time 固定

      let disposed = false;
      let contextLost = false;
      let failedMessage = null;      // 非 null 代表著色器編譯／連結失敗
      let noWebGL = false;
      let pageVisible = !document.hidden;
      let intersecting = true;
      let reduceMotion = false;
      let observer = null;
      let motionQuery = null;
      let drawnFrames = 0;

      const fpsDisplay = document.getElementById('fps-display');
      const resDisplay = document.getElementById('res-display');
      const lifecycleStatus = document.getElementById('lifecycle-status');
      const modeMetalBtn = document.getElementById('mode-metal');
      const modeFluidBtn = document.getElementById('mode-fluid');
      const btnSwitchMode = document.getElementById('btn-switch-mode');
      const btnToggleSim = document.getElementById('btn-toggle-sim');

      let statusState = 'init';

      function setStatus(state, text) {
        statusState = state;
        if (lifecycleStatus) {
          lifecycleStatus.textContent = '生命週期狀態：' + text;
          lifecycleStatus.setAttribute('data-state', state);
          if (state === 'error' || state === 'nowebgl') {
            lifecycleStatus.setAttribute('role', 'alert');
          } else {
            lifecycleStatus.removeAttribute('role');
          }
        }
        if (state !== 'running' && fpsDisplay) fpsDisplay.textContent = '--';
      }

      // 3. WebGL 管線
      function compileShader(glCtx, type, source, label) {
        const shader = glCtx.createShader(type);
        if (!shader) throw new Error(label + ' 建立失敗（context 可能已遺失）');
        glCtx.shaderSource(shader, source);
        glCtx.compileShader(shader);
        if (!glCtx.getShaderParameter(shader, glCtx.COMPILE_STATUS)) {
          const info = glCtx.getShaderInfoLog(shader) || '(無 info log)';
          glCtx.deleteShader(shader);
          throw new Error(label + ' 編譯失敗：' + info);
        }
        return shader;
      }

      function releasePipeline() {
        if (!gl) return;
        if (positionBuffer) { gl.deleteBuffer(positionBuffer); positionBuffer = null; }
        if (vs) { gl.deleteShader(vs); vs = null; }
        if (fs) { gl.deleteShader(fs); fs = null; }
        if (program) { gl.deleteProgram(program); program = null; }
      }

      // 建立 Program、緩衝區與 uniform 位置。context 恢復後必須整個重跑一次。
      function buildPipeline() {
        releasePipeline();
        try {
          vs = compileShader(gl, gl.VERTEX_SHADER, VS_SOURCE, '頂點著色器');
          fs = compileShader(gl, gl.FRAGMENT_SHADER, FS_SOURCE, '片段著色器');

          program = gl.createProgram();
          gl.attachShader(program, vs);
          gl.attachShader(program, fs);
          gl.linkProgram(program);
          if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            throw new Error('Program 連結失敗：' + (gl.getProgramInfoLog(program) || '(無 info log)'));
          }
        } catch (err) {
          releasePipeline();
          throw err;
        }

        gl.useProgram(program);
        uResolutionLoc = gl.getUniformLocation(program, 'u_resolution');
        uTimeLoc = gl.getUniformLocation(program, 'u_time');
        uMouseLoc = gl.getUniformLocation(program, 'u_mouse');
        uModeLoc = gl.getUniformLocation(program, 'u_mode');

        positionBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

        const aPositionLoc = gl.getAttribLocation(program, 'a_position');
        gl.enableVertexAttribArray(aPositionLoc);
        gl.vertexAttribPointer(aPositionLoc, 2, gl.FLOAT, false, 0, 0);
      }

      function showFallback() {
        document.body.classList.add('hero-fallback');
      }

      function fail(err) {
        failedMessage = String(err && err.message ? err.message : err).slice(0, ERROR_LOG_MAX);
        console.error('[shader-hero-demo] ' + failedMessage);
        showFallback();
        syncLoop();
      }

      function initGL() {
        canvas = document.getElementById('gl-canvas');
        if (!canvas) return false;
        gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        if (!gl) {
          noWebGL = true;
          showFallback();
          return false;
        }
        try {
          buildPipeline();
        } catch (err) {
          fail(err);
          return false;
        }
        resizeCanvas();
        return true;
      }

      // 4. 視窗適配與高解析度 (DPR) 處理
      function resizeCanvas() {
        if (!canvas || !gl) return;
        const dpr = Math.min(window.devicePixelRatio || 1, 2.0);
        const displayWidth = Math.max(1, Math.floor(window.innerWidth * dpr));
        const displayHeight = Math.max(1, Math.floor(window.innerHeight * dpr));
        if (canvas.width !== displayWidth || canvas.height !== displayHeight) {
          canvas.width = displayWidth;
          canvas.height = displayHeight;
        }
        if (!gl.isContextLost()) gl.viewport(0, 0, displayWidth, displayHeight);
        if (resDisplay) resDisplay.textContent = displayWidth + 'x' + displayHeight;
        if (!rafId) drawFrame();     // 沒有渲染迴圈時（靜態畫面）縮放後補畫一幀
      }

      // 5. 繪製一幀（渲染迴圈與靜態畫面共用）
      function drawFrame(timeOverride) {
        if (!gl || !program || disposed || gl.isContextLost()) return false;
        const t = timeOverride !== undefined ? timeOverride
          : (frozenTime !== null ? frozenTime
            : (reduceMotion ? STILL_TIME : (performance.now() - startTime) * 0.001));
        gl.useProgram(program);
        gl.uniform2f(uResolutionLoc, canvas.width, canvas.height);
        gl.uniform1f(uTimeLoc, t);
        gl.uniform2f(uMouseLoc, currentMouseX * (canvas.width / window.innerWidth),
                                (window.innerHeight - currentMouseY) * (canvas.height / window.innerHeight));
        gl.uniform1i(uModeLoc, currentMode);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        drawnFrames++;
        return true;
      }

      function renderLoop(now) {
        rafId = null;
        if (!wantRun()) return;

        // 與影格率無關的指數平滑
        const dt = lastFrameTime === null ? 0.016 : Math.min((now - lastFrameTime) / 1000, 0.25);
        lastFrameTime = now;
        const k = 1 - Math.exp(-dt / MOUSE_TAU);
        currentMouseX += (targetMouseX - currentMouseX) * k;
        currentMouseY += (targetMouseY - currentMouseY) * k;

        if (drawFrame()) {
          frameCount++;
          if (lastFpsTime === null) lastFpsTime = now;
          if (now - lastFpsTime >= 500) {
            const fps = Math.round((frameCount * 1000) / (now - lastFpsTime));
            if (fpsDisplay) fpsDisplay.textContent = fps;
            frameCount = 0;
            lastFpsTime = now;
          }
          if (statusState !== 'running') setStatus('running', '執行中（WebGL 逐幀繪製）');
        }
        rafId = requestAnimationFrame(renderLoop);
      }

      function wantRun() {
        return !disposed && !contextLost && !failedMessage && !noWebGL && !!program &&
               !reduceMotion && pageVisible && intersecting;
      }

      // 依目前條件決定要不要跑迴圈，並讓狀態文字反映真實原因。
      function syncLoop() {
        if (disposed) {
          setStatus('disposed', '已釋放 (Disposed)');
        } else if (noWebGL) {
          setStatus('nowebgl', '此環境無法建立 WebGL，已改用 CSS 靜態漸層');
        } else if (failedMessage) {
          setStatus('error', '著色器失敗，已改用 CSS 靜態漸層。' + failedMessage);
        } else if (contextLost) {
          setStatus('lost', 'WebGL context 已遺失，等待瀏覽器恢復');
        } else if (reduceMotion) {
          setStatus('static', '偵測到 prefers-reduced-motion，顯示靜態畫面');
        } else if (!pageVisible) {
          setStatus('paused', '分頁在背景，已暫停繪製');
        } else if (!intersecting) {
          setStatus('paused', '畫布離開可視範圍，已暫停繪製');
        }

        if (wantRun()) {
          if (!rafId) {
            lastFrameTime = null;
            lastFpsTime = null;
            frameCount = 0;
            rafId = requestAnimationFrame(renderLoop);
          }
        } else {
          if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
          if (reduceMotion && program && !contextLost && !disposed) drawFrame();
        }
      }

      // 6. 資源清理
      function dispose() {
        if (disposed) return;
        disposed = true;
        if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
        if (observer) { observer.disconnect(); observer = null; }
        window.removeEventListener('resize', resizeCanvas);
        window.removeEventListener('pointermove', onPointerMove);
        document.removeEventListener('visibilitychange', onVisibilityChange);
        if (canvas) {
          canvas.removeEventListener('webglcontextlost', onContextLost);
          canvas.removeEventListener('webglcontextrestored', onContextRestored);
        }
        if (motionQuery) motionQuery.removeEventListener('change', onMotionChange);
        releasePipeline();
        syncLoop();
      }

      // 7. 事件處理
      function onPointerMove(e) {
        targetMouseX = e.clientX;
        targetMouseY = e.clientY;
      }

      function onVisibilityChange() {
        pageVisible = !document.hidden;
        syncLoop();
      }

      function onMotionChange(e) {
        reduceMotion = e.matches;
        syncLoop();
      }

      function onContextLost(e) {
        e.preventDefault();          // 不呼叫就無法再收到 restored 事件
        contextLost = true;
        // context 遺失後所有 GL 物件都已失效；只丟掉參考，不要對它們呼叫 delete*（會產生 INVALID_OPERATION）
        program = vs = fs = positionBuffer = null;
        syncLoop();
      }

      function onContextRestored() {
        contextLost = false;
        try {
          buildPipeline();           // 舊的 Program／緩衝區在 context 遺失時已失效，必須重建
          resizeCanvas();
        } catch (err) {
          fail(err);
          return;
        }
        syncLoop();
      }

      function setMode(mode) {
        currentMode = mode;
        modeMetalBtn.classList.toggle('active', mode === 0);
        modeFluidBtn.classList.toggle('active', mode === 1);
        modeMetalBtn.setAttribute('aria-pressed', String(mode === 0));
        modeFluidBtn.setAttribute('aria-pressed', String(mode === 1));
        if (!rafId) drawFrame();
      }

      // 8. 啟動與綁定
      function boot() {
        motionQuery = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
        reduceMotion = !!(motionQuery && motionQuery.matches);
        targetMouseX = currentMouseX = window.innerWidth / 2;
        targetMouseY = currentMouseY = window.innerHeight / 2;

        initGL();

        window.addEventListener('resize', resizeCanvas, false);
        window.addEventListener('pointermove', onPointerMove, { passive: true });
        document.addEventListener('visibilitychange', onVisibilityChange, false);
        if (motionQuery) motionQuery.addEventListener('change', onMotionChange);
        if (canvas) {
          canvas.addEventListener('webglcontextlost', onContextLost, false);
          canvas.addEventListener('webglcontextrestored', onContextRestored, false);
          if ('IntersectionObserver' in window) {
            observer = new IntersectionObserver(function (entries) {
              intersecting = entries[entries.length - 1].isIntersecting;
              syncLoop();
            }, { threshold: 0.05 });
            observer.observe(canvas);
          }
        }

        modeMetalBtn.addEventListener('click', function () { setMode(0); });
        modeFluidBtn.addEventListener('click', function () { setMode(1); });
        btnSwitchMode.addEventListener('click', function () { setMode(currentMode === 0 ? 1 : 0); });
        btnToggleSim.addEventListener('click', function () {
          const ext = gl && gl.getExtension('WEBGL_lose_context');
          if (!ext || gl.isContextLost()) {
            setStatus('error', '無法模擬：目前沒有可用的 WebGL context 或瀏覽器不支援 WEBGL_lose_context');
            return;
          }
          ext.loseContext();
          setTimeout(function () { if (!disposed) ext.restoreContext(); }, 800);
        });

        syncLoop();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot);
      } else {
        boot();
      }

      // 測試／除錯介面（Playwright 測試使用；不是頁面功能）
      window.__SHADER_HERO_DEMO__ = {
        dispose: dispose,
        setMode: setMode,
        freezeTime: function (sec) { frozenTime = sec; },
        drawFrame: function () { return drawFrame(); },
        getGL: function () { return gl; },
        getProgram: function () { return program; },
        getState: function () {
          return {
            status: statusState,
            failedMessage: failedMessage,
            contextLost: contextLost,
            reduceMotion: reduceMotion,
            running: rafId !== null,
            drawnFrames: drawnFrames,
            mouse: [currentMouseX, currentMouseY],
            target: [targetMouseX, targetMouseY],
            mode: currentMode
          };
        }
      };
    })();
  </script>
</body>
</html>
