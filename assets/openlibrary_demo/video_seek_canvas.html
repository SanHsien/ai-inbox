<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Welcome to Open Library | Open Library — Code-as-Video seek(t) Studio Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: rgb(227, 222, 202);
      color: rgb(61, 56, 46);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #stage-container {
      position: relative;
      width: 960px;
      height: 540px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      background: #0d0f12;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #controls {
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      width: 960px;
      background: rgba(255, 255, 255, 0.05);
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 13px;
    }
    #scrubber {
      flex: 1;
      cursor: pointer;
    }
    .badge {
      background: rgb(255, 255, 255);
      color: #fff;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div id="stage-container">
    <canvas id="video-canvas" width="1920" height="1080"></canvas>
  </div>

  <div id="controls">
    <button id="play-btn">播放 / 暫停</button>
    <input type="range" id="scrubber" min="0" max="6.0" step="0.016" value="0">
    <span id="time-display">0.00s / 6.0.00s</span>
    <span class="badge">V = f(t) seek(t)</span>
  </div>

  <script>
    const canvas = document.getElementById('video-canvas');
    const ctx = canvas.getContext('2d');
    const scrubber = document.getElementById('scrubber');
    const timeDisplay = document.getElementById('time-display');
    const playBtn = document.getElementById('play-btn');

    const THEME = {"url": "https://openlibrary.org", "title": "Welcome to Open Library | Open Library", "primary_color": "rgb(255, 255, 255)", "background_color": "rgb(227, 222, 202)", "text_color": "rgb(61, 56, 46)", "accent_color": "rgb(61, 56, 46)", "screenshot_file": "screenshot.png"};
    const DURATION = 6.0;

    // 載入真實截圖（若存在）
    const screenshotImg = new Image();
    let imageLoaded = false;
    screenshotImg.src = 'screenshot.png';
    screenshotImg.onload = () => {
      imageLoaded = true;
      seek(parseFloat(scrubber.value));
    };

    // 物理彈簧與節奏插值函式
    function spring(t, start, end, stiffness = 220, damping = 20) {
      if (t <= 0) return start;
      const progress = Math.min(t, 1.0);
      const decay = Math.exp(-damping * progress * 0.1);
      const val = 1 - decay * Math.cos(stiffness * progress * 0.05);
      return start + (end - start) * Math.min(Math.max(val, 0), 1.05);
    }

    function clamp(val, min, max) {
      return Math.max(min, Math.min(max, val));
    }

    /**
     * 核心時間函式：Frame = f(t, state)
     * 任意時刻直接隨機尋軌渲染，具備像素級確定性
     */
    window.seek = function(t) {
      t = clamp(t, 0, DURATION);

      // 1. 清空畫布與繪製現代非對稱幾何背景（反漸層套路）
      ctx.fillStyle = THEME.background_color || '#0d0f12';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 細緻幾何輔助網格
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
      ctx.lineWidth = 1;
      const gridSize = 80;
      for (let x = 0; x < canvas.width; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // 2. 宏觀相機推拉運鏡 (Hero Close-up -> Feature Pan)
      // t: 0.0 ~ 2.0: Dolly in 聚焦
      // t: 2.0 ~ 5.0: Horizontal Pan + 微幅旋轉
      ctx.save();
      const scale = spring(t / 2.0, 0.92, 1.04);
      const panX = (t > 2.0) ? (t - 2.0) * -25 : 0;
      ctx.translate(canvas.width / 2 + panX, canvas.height / 2);
      ctx.scale(scale, scale);

      // 3. 渲染真實產品畫面主卡片 (3D 輕量透視投影)
      const cardWidth = 1200;
      const cardHeight = 675;
      const cardX = -cardWidth / 2;
      const cardY = -cardHeight / 2 + 30;

      // 卡片陰影
      ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
      ctx.shadowBlur = 40;
      ctx.shadowOffsetY = 20;

      // 邊框與背景
      ctx.fillStyle = '#161920';
      ctx.strokeStyle = THEME.primary_color || '#3b82f6';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.roundRect(cardX, cardY, cardWidth, cardHeight, 16);
      ctx.fill();
      ctx.stroke();

      ctx.shadowColor = 'transparent';

      // 貼入真機截圖
      if (imageLoaded) {
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(cardX, cardY, cardWidth, cardHeight, 16);
        ctx.clip();
        ctx.drawImage(screenshotImg, cardX, cardY, cardWidth, cardHeight);
        ctx.restore();
      } else {
        // 若截圖未載入則繪製幾何線框示意
        ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.fillRect(cardX + 20, cardY + 20, cardWidth - 40, cardHeight - 40);
        ctx.fillStyle = '#fff';
        ctx.font = '24px monospace';
        ctx.fillText('Real Asset Capture Area (' + THEME.title + ')', cardX + 40, cardY + 80);
      }

      ctx.restore();

      // 4. Kinetic Typography（動態標題依節奏登場）
      // t: 0.5s 開始彈簧位移進入
      if (t >= 0.5) {
        const textProgress = spring(t - 0.5, 0, 1);
        ctx.save();
        ctx.translate(140, 160 + (1 - textProgress) * 40);
        ctx.globalAlpha = textProgress;
        ctx.fillStyle = THEME.accent_color || '#38bdf8';
        ctx.font = '600 28px -apple-system, sans-serif';
        ctx.fillText('FEATURE SPOTLIGHT // ' + THEME.title, 0, 0);

        ctx.fillStyle = '#ffffff';
        ctx.font = '800 64px -apple-system, sans-serif';
        ctx.fillText('Evidence-First Architecture', 0, 75);
        ctx.restore();
      }

      // 5. 畫面時間碼與音畫節拍提示
      ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.font = '16px monospace';
      ctx.fillText('FRAME TIME: ' + t.toFixed(3) + 's / ' + DURATION.toFixed(2) + 's', 140, canvas.height - 80);

      // 同步 UI 控制項
      scrubber.value = t;
      timeDisplay.innerText = t.toFixed(2) + 's / ' + DURATION.toFixed(2) + 's';
    };

    // 播放循環
    let isPlaying = false;
    let animId = null;
    let lastTimestamp = null;

    function loop(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const dt = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;

      let nextTime = parseFloat(scrubber.value) + dt;
      if (nextTime > DURATION) {
        nextTime = 0;
      }
      window.seek(nextTime);

      if (isPlaying) {
        animId = requestAnimationFrame(loop);
      }
    }

    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      if (isPlaying) {
        playBtn.innerText = '暫停';
        lastTimestamp = null;
        animId = requestAnimationFrame(loop);
      } else {
        playBtn.innerText = '播放';
        if (animId) cancelAnimationFrame(animId);
      }
    });

    scrubber.addEventListener('input', (e) => {
      if (isPlaying) {
        isPlaying = false;
        playBtn.innerText = '播放';
        if (animId) cancelAnimationFrame(animId);
      }
      window.seek(parseFloat(e.target.value));
    });

    // 初始化渲染第 0 幀
    window.seek(0);
  </script>
</body>
</html>
